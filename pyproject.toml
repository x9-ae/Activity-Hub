[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-hub"
version = "0.3.1"
description = "Permanent, append-only activity and audit log for applications, stored in ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8.15,<0.9",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
test = ["pytest==8.3.3", "starlette>=0.41", "httpx>=0.27", "sqlalchemy>=2.0"]

[tool.setuptools.packages.find]
include = ["activity_hub*"]

[tool.setuptools.package-data]
activity_hub = ["migrations/*.sql", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning"]
