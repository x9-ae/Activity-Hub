name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: admin
          CLICKHOUSE_PASSWORD: admin
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -q -O - http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install ".[test]"

      - run: pytest -q
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: admin
          CLICKHOUSE_PASSWORD: admin

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # apps install the built viewer from the release archive: the committed build must be this one
      - run: git diff --exit-code viewer/dist || (echo "viewer/dist is out of date: run npm run build and commit it" && exit 1)
